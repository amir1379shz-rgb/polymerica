<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root{
    --navy:#0f2039;
    --navy2:#16294a;
    --gold:#c9a227;
    --cream:#f5efe0;
    --line:rgba(15,32,57,0.12);
    --text:#1c2b40;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family:'Vazirmatn','Tahoma',sans-serif;
    color:var(--text);
    line-height:1.9;
  }
  .top-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 20px;
  }
  .top-nav a{
    text-decoration:none;
    color:var(--navy);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 18px;
    font-size:0.9rem;
  }
  .brand{
    font-weight:800;
    font-size:1.2rem;
    color:var(--gold);
  }
  .hero{
    margin:0 16px 24px;
    background:linear-gradient(160deg,var(--navy),var(--navy2));
    color:#fff;
    border-radius:22px;
    padding:28px 22px;
  }
  .hero .eyebrow{color:var(--gold);font-size:0.85rem;margin-bottom:10px;}
  .hero h1{margin:0 0 12px;font-size:1.6rem;}
  .hero p{margin:0;color:rgba(255,255,255,0.78);font-size:0.92rem;}

  .toc{
    margin:0 16px 20px;
    background:#fff;
    border-radius:18px;
    padding:16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .toc a{
    text-decoration:none;
    color:var(--navy);
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
    font-size:0.85rem;
    font-weight:700;
  }

  .material-card{
    margin:0 16px 16px;
    background:#fff;
    border-radius:20px;
    padding:22px;
    scroll-margin-top:20px;
    border:1px solid var(--line);
  }
  .material-card h2{
    margin:0 0 4px;
    color:var(--navy);
    font-size:1.35rem;
  }
  .material-card .grade{
    color:var(--gold);
    font-size:0.85rem;
    margin-bottom:14px;
  }
  .material-card p.desc{
    margin:0 0 16px;
    font-size:0.95rem;
  }
  .spec-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
  }
  .spec{
    background:var(--cream);
    border-radius:12px;
    padding:12px;
  }
  .spec .label{font-size:0.78rem;color:rgba(28,43,64,0.65);margin-bottom:4px;}
  .spec .value{font-weight:800;color:var(--navy);}
  .uses, .tips{
    margin:0 0 12px;
  }
  .uses h3, .tips h3{
    font-size:0.95rem;
    color:var(--navy);
    margin:0 0 8px;
  }
  .uses ul, .tips ul{
    margin:0;
    padding-inline-start:20px;
    font-size:0.9rem;
  }
  .uses li, .tips li{margin-bottom:4px;}
  .back-top{
    display:block;
    text-align:center;
    margin:24px 16px 40px;
    color:var(--navy);
    text-decoration:none;
    font-size:0.85rem;
  }
</style>
</head>

  </div>

  <div class="toc" id="toc"></div>

const slugMap = {};
MATERIALS.forEach(m => slugMap[m.id] = m);

function render(){
  const toc = document.getElementById('toc');
  const wrap = document.getElementById('materials');
  toc.innerHTML = MATERIALS.map(m => `<a href="#${m.id}">${m.name}</a>`).join('');
  wrap.innerHTML = MATERIALS.map(m => `

      <h2>${m.name}</h2>
      <div class="grade">${m.grade}</div>
